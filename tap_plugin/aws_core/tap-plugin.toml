[falsifiers]
# One per reconcilable type: every type some model's CONTAINMENT_EDGES makes a containment TARGET
# (validate_plugin's falsifier-coverage check).
#
# Subnet — Vpc -> PARTITIONED_INTO_SUBNET, the foundation (tap-plugin-aws-core#42; see
# tap_plugin/aws_core/falsifiers.py for why Subnet, not VPC itself).
#
# VPC, EC2 instance and security group (tap-plugin-aws-core#43) were registered AHEAD of a
# containment path reaching them (no CONTAINMENT_EDGES target named them yet), exercised by
# tests only, like Subnet above — "they become live the moment a containment edge does" (that
# PR's own words). tap-plugin-aws-core#49 (region-scoped containment) is that containment edge:
# AwsAccountRegion.CONTAINMENT_EDGES now reaches all three, so each can produce real candidates
# from a real collector run, not only from tests. See tap_plugin/aws_core/regional.py and
# collectors/boto3_collector/containment.py for the mechanism.
#
# OU and account — the Organizations tree (tap-plugin-aws-core#50): AwsOrganization and
# AwsOrganizationalUnit -> PARTITIONED_INTO_OU, AwsOrganization -> ENROLLS_ACCOUNT. The collector
# records a surface for each of those listings (collectors/boto3_collector/organizations.py), so
# these two — like Subnet above — are reachable from a live run today, not test-only.
# AwsOrganization itself has none: nothing contains it.
