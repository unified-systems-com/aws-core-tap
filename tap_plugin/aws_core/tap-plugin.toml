[falsifiers]
# One per reconcilable type: every type some model's CONTAINMENT_EDGES makes a containment TARGET
# (validate_plugin's falsifier-coverage check).
#
# Subnet — Vpc -> PARTITIONED_INTO_SUBNET, the foundation (tap-plugin-aws-core#42; see
# tap_plugin/aws_core/falsifiers.py for why Subnet, not VPC itself).
#
# VPC, EC2 instance and security group (tap-plugin-aws-core#43) were registered AHEAD of a
# containment path reaching them (no CONTAINMENT_EDGES target named them yet), exercised by
# tests only, like Subnet above — "they become live the moment a containment edge does" (that
# PR's own words). tap-plugin-aws-core#49 (region-scoped containment) is that containment edge:
# AwsAccountRegion.CONTAINMENT_EDGES now reaches all three, so each can produce real candidates
# from a real collector run, not only from tests. See tap_plugin/aws_core/regional.py and
# collectors/boto3_collector/containment.py for the mechanism.
#
# OU and account — the Organizations tree (tap-plugin-aws-core#50): AwsOrganization and
# AwsOrganizationalUnit -> PARTITIONED_INTO_OU, AwsOrganization -> ENROLLS_ACCOUNT. The collector
# records a surface for each of those listings (collectors/boto3_collector/organizations.py), so
# these two — like Subnet above — are reachable from a live run today, not test-only.
# AwsOrganization itself has none: nothing contains it.
aws_core__aws_subnet = "tap_plugin.aws_core.falsifiers.SubnetFalsifier"
aws_core__aws_vpc = "tap_plugin.aws_core.falsifiers.VpcFalsifier"
aws_core__aws_security_group = "tap_plugin.aws_core.falsifiers.SecurityGroupFalsifier"
aws_core__aws_ec2_instance = "tap_plugin.aws_core.falsifiers.Ec2InstanceFalsifier"
aws_core__aws_organizational_unit = "tap_plugin.aws_core.falsifiers.OrganizationalUnitFalsifier"
aws_core__aws_account = "tap_plugin.aws_core.falsifiers.AccountFalsifier"
# Storage + IAM (aws-core-tap#41, a slice of the falsification epic aws-core-tap#15). Also
# registered ahead of a containment path reaching them, exactly like the row above — see the
# module docstring on why none of these four is dispatchable in production yet, and on the
# customer-managed-only scope of the IAM policy falsifier.
aws_core__aws_s3_bucket = "tap_plugin.aws_core.falsifiers.S3BucketFalsifier"
aws_core__aws_iam_role = "tap_plugin.aws_core.falsifiers.IamRoleFalsifier"
aws_core__aws_iam_user = "tap_plugin.aws_core.falsifiers.IamUserFalsifier"
aws_core__aws_iam_policy = "tap_plugin.aws_core.falsifiers.IamPolicyFalsifier"
# Account-scoped containment (aws-core-tap#43): OWNS_OIDC_PROVIDER__aws_core makes an IAM OIDC
# provider reconcilable.
aws_core__aws_iam_oidc_provider = "tap_plugin.aws_core.falsifiers.IamOidcProviderFalsifier"
# Organizations completeness (aws-core-tap#65, req-aws-core-organizations-completeness): the
# organization contains its delegations (HOLDS_DELEGATION) and its customer-managed policies
# (HOLDS_SERVICE_CONTROL_POLICY, HOLDS_ORGANIZATIONS_POLICY); a policy contains its statements
# (DECLARES_STATEMENT) and a tag policy its rules (DECLARES_TAG_RULE). The collector records a
# surface for every one of those pairs. Registered, not armed: reconcile authority stays off.
aws_core__aws_delegated_administration = "tap_plugin.aws_core.falsifiers.DelegatedAdministrationFalsifier"
aws_core__aws_service_control_policy = "tap_plugin.aws_core.falsifiers.OrganizationsPolicyFalsifier"
aws_core__aws_organizations_policy = "tap_plugin.aws_core.falsifiers.OrganizationsPolicyFalsifier"
aws_core__aws_policy_statement = "tap_plugin.aws_core.falsifiers.PolicyStatementFalsifier"
aws_core__aws_tag_policy_rule = "tap_plugin.aws_core.falsifiers.TagPolicyRuleFalsifier"

# Landing zone (aws-core-tap#66, spec-aws-core-landing-zone.md): the footprint contains the landing
# zone, the Identity Center instance and the per-region security services; the landing zone contains
# its enabled controls and baselines; the instance contains its permission sets, groups and account
# assignments. collectors/boto3_collector/landing_zone.py records a surface for every one of those
# pairs. Registered, not armed: reconcile authority stays off.
aws_core__aws_controltower_landing_zone = "tap_plugin.aws_core.falsifiers.LandingZoneFalsifier"
aws_core__aws_controltower_enabled_control = "tap_plugin.aws_core.falsifiers.EnabledControlFalsifier"
aws_core__aws_controltower_enabled_baseline = "tap_plugin.aws_core.falsifiers.EnabledBaselineFalsifier"
aws_core__aws_identity_center_instance = "tap_plugin.aws_core.falsifiers.IdentityCenterInstanceFalsifier"
aws_core__aws_identity_center_permission_set = "tap_plugin.aws_core.falsifiers.PermissionSetFalsifier"
aws_core__aws_identity_center_group = "tap_plugin.aws_core.falsifiers.IdentityGroupFalsifier"
aws_core__aws_identity_center_account_assignment = "tap_plugin.aws_core.falsifiers.AccountAssignmentFalsifier"
aws_core__aws_config_recorder = "tap_plugin.aws_core.falsifiers.ConfigRecorderFalsifier"
aws_core__aws_config_delivery_channel = "tap_plugin.aws_core.falsifiers.ConfigDeliveryChannelFalsifier"
aws_core__aws_config_aggregator = "tap_plugin.aws_core.falsifiers.ConfigAggregatorFalsifier"
aws_core__aws_guardduty_detector = "tap_plugin.aws_core.falsifiers.GuardDutyDetectorFalsifier"
aws_core__aws_securityhub_hub = "tap_plugin.aws_core.falsifiers.SecurityHubHubFalsifier"
aws_core__aws_access_analyzer = "tap_plugin.aws_core.falsifiers.AccessAnalyzerFalsifier"

