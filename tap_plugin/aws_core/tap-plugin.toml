plugin_version = "v0.8.0" # x-release-please-version
# 0.2.1 (2026-09-22): the first core release the [falsifiers] table + tap_grid.falsifiers /
# tap_grid.falsifier_testing (Candidate, Expected, Falsifier, Probe, Verdict, verdict_from_probe,
# run_four_cases) resolve against — 0.1.6, the release before it, refuses the [falsifiers] key at
# manifest parse (mirrors tap-plugin-github-core's own floor note for the identical reason,
# tap-plugin-aws-core#42).
# 0.3.0: the first core release with tap_grid.services.entity_liveness (req-grid-service-read-direct-4),
# which the collector asks before re-sending a fixed edge id, edge-endpoint keys and declared edge
# identity (natural-key refs), and the GRIFT edge_cases section (authority claims).
