# TAP AWS Core plugin — package-mode distribution (namespaced 2026-07-01).
# Identity (conformance gate): slug "aws_core" == dist "aws-core-tap" ==
# namespace "tap_plugin.aws_core" == entry-point key. Migrated OUT of
# [tool.uv.workspace] members; its Tier-0 `boto3` dep travels with the plugin and
# uv resolves it when the pre-boot stage installs it (req-plugin-arch-dependencies-1).
[project]
name = "aws-core-tap"
description = "TAP AWS Core plugin — AWS resource-type models and the boto3 collection engine."
requires-python = ">=3.14"
dynamic = ["version"]

# Tier-0: the boto3 collection engine is plugin-specific (not core-provided).
# The AWS SDK is pinned exactly, on purpose: a floating botocore changes service
# shapes under us (1.44.4 dropped AgentProfileSummary.tags and turned CI red).
# Bump both pins together only in a PR that runs this suite;
# tap_plugin/aws_core/tests/test_boto3_collector_sensitivity.py is the drift check.
# computing_core: aws_core stamps the `tap.computing.cloud` dimension, which only
# computing_core's dimension bundle declares; on a core with live-dimension
# resolution (tap#1196) aws_core without it has most writes refused (aws-build Q73).
# Our own *-tap packages stay ranges; it resolves through the boot record's git source.
dependencies = [
    "boto3==1.44.7",
    "botocore==1.44.7",
    "computing-core-tap>=0.10.8,<0.11",
]

[project.entry-points."tap.plugins"]
aws_core = "tap_plugin.aws_core.apps:AwsCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/aws_core"]
